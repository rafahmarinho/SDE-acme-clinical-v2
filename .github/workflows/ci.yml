name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly dependency audit + network TLS checks
    - cron: "0 5 1 * *"   # monthly re-deployment drill
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to production (migrations, API, web, smoke test)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
        env:
          RUN_NETWORK_TESTS: ${{ github.event_name == 'schedule' && '1' || '0' }}
      - name: Dependency audit (fails on any known vulnerability)
        run: pip-audit -r requirements.txt --strict
      - name: Scanner canary (pip-audit must detect a known-vulnerable pin)
        run: |
          echo "jinja2==2.10" > /tmp/canary.txt
          if pip-audit -r /tmp/canary.txt --no-deps; then echo "pip-audit did not detect the canary"; exit 1; fi
      - name: License check (allow-list)
        run: |
          pip install pip-licenses==5.0.0
          pip-licenses --from=mixed --partial-match \
            --packages $(grep -Eo '^[A-Za-z0-9_.-]+' requirements.txt | tr '\n' ' ') \
            --allow-only="MIT;BSD;Apache;ISC;Python Software Foundation;PSF;Unlicense;Mozilla Public License 2.0;MPL-2.0;GNU Lesser General Public License v3;LGPL-3.0;The Unlicense"

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - run: pnpm test -- --run
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-public-anon-key
          VITE_API_BASE_URL: https://api.example.test
      - name: Bundle has no server secrets or third-party scripts
        run: |
          if grep -rEi "service_role|SUPABASE_SERVICE_ROLE_KEY|SUPABASE_JWT_SECRET|DATABASE_URL|AUDIT_SIGNING_KEY|CONFIG_INTEGRITY_KEY|BEGIN [A-Z ]*PRIVATE KEY" dist; then exit 1; fi
          if grep -Eo '<script[^>]+src="https?://' dist/index.html; then exit 1; fi
      - name: Dependency audit
        run: pnpm audit --audit-level=moderate
      - name: Scanner canary (pnpm audit must detect a known-vulnerable package)
        run: |
          mkdir -p /tmp/canary && cd /tmp/canary
          printf '{"name":"canary","version":"1.0.0","private":true,"dependencies":{"lodash":"4.17.15"}}' > package.json
          pnpm install --lockfile-only --ignore-scripts
          if pnpm audit --audit-level=high; then echo "pnpm audit did not detect the canary"; exit 1; fi
      - name: License check (allow-list)
        run: |
          pnpm licenses list --prod --json > /tmp/licenses.json
          node -e '
            const allowed = /^(MIT|ISC|BSD-2-Clause|BSD-3-Clause|Apache-2.0|0BSD|BlueOak-1.0.0|MPL-2.0|CC0-1.0|Unlicense|Python-2.0)$/;
            const data = require("/tmp/licenses.json");
            const bad = Object.keys(data).filter((l) => !l.split(/ OR | AND |[()]/).filter(Boolean).every((p) => allowed.test(p.trim())));
            if (bad.length) { console.error("Unapproved licenses:", bad); process.exit(1); }'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  db-drill:
    # Re-deployment drill: rebuild the database from git (all migrations + seed) in a disposable stack.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Fresh database from migrations and seed
        run: |
          start=$(date +%s)
          supabase init --force >/dev/null 2>&1 || true
          supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector
          supabase db reset
          echo "rebuild_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify seed and RLS
        run: |
          DB=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          test "$(psql "$DB" -tAc 'select count(*) from public.patients')" = "12"
          test "$(psql "$DB" -tAc 'select count(*) from public.monitors')" = "10"
          test "$(psql "$DB" -tAc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and not c.relrowsecurity")" = "0"
          psql "$DB" -v ON_ERROR_STOP=1 -c "select public.run_retention_purge('manual')"
      - name: Access-control checks as the API role (T19, T2598)
        run: |
          DB=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          # Disposable stack only: a throwaway password so the suite can log in as acme_api itself.
          CI_PW="ci-$(openssl rand -hex 16)"
          psql "$DB" -v ON_ERROR_STOP=1 -c "alter role acme_api with password '${CI_PW}'"
          psql "postgresql://acme_api:${CI_PW}@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/access_control.sql

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: [backend, frontend, secrets, db-drill]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - uses: pnpm/action-setup@v4
      - name: Database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push
      - name: Auth configuration as code (templates, OTP expiry, SMTP; T2/T1386/T2157)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SMTP_HOST: ${{ secrets.SUPABASE_SMTP_HOST }}
          SUPABASE_SMTP_USER: ${{ secrets.SUPABASE_SMTP_USER }}
          SUPABASE_SMTP_PASS: ${{ secrets.SUPABASE_SMTP_PASS }}
          SUPABASE_SMTP_ADMIN_EMAIL: ${{ secrets.SUPABASE_SMTP_ADMIN_EMAIL }}
        run: supabase --yes config push --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: API and web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          npm i -g vercel@latest
          VERCEL_PROJECT_ID="${{ secrets.VERCEL_BACKEND_PROJECT_ID }}" vercel deploy --prod --cwd backend --token "$VERCEL_TOKEN" --yes
          VERCEL_PROJECT_ID="${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}" vercel deploy --prod --cwd frontend --token "$VERCEL_TOKEN" --yes
      - name: Smoke test
        run: |
          curl -fsS "${{ secrets.API_BASE_URL }}/v1/health" | grep -q '"ok"'
          curl -fsS -o /dev/null "${{ secrets.WEB_BASE_URL }}/"
