# Supabase project configuration (Supabase CLI). Authentication settings are kept as code so they can
# be reviewed and tested (backend/tests/test_authentication.py). Apply the same values to the hosted
# project (Dashboard > Authentication) - see docs/security/authentication.md for the checklist.
# No secrets in this file: values that are secret use env(...) and come from the operator's environment.

project_id = "acme-clinical"

[api]
enabled = true
port = 54321
# Only `public` is exposed through the Data API (RLS on every table). The `private` schema (lockout
# counters, login history, device-auth failures) is never exposed.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
# Demo data only: no auth.users rows, no passwords (see supabase/seed.sql).
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "https://acme-clinical.vercel.app"
# Exact allow-list for redirects (password recovery, invitations, e-mail change). No wildcards.
additional_redirect_urls = [
  "https://acme-clinical.vercel.app/reset-password",
  "http://localhost:5173/reset-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Accounts are created only by administrators (Team > Invite, Supabase invite link). No self sign-up.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
# Platform floor; the application may require more (public.security_settings.password_min_length).
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"
# Leaked-password protection (Have I Been Pwned) is a hosted-project setting:
# Dashboard > Authentication > Attack Protection > "Prevent use of leaked passwords" = ON.

[auth.rate_limit]
# Per hour unless noted. Tight values: a hospital staff directory, not a consumer app.
email_sent = 10
sms_sent = 0
anonymous_users = 0
token_refresh = 150
# Sign-in / sign-up requests per 5 minutes per IP address.
sign_in_sign_ups = 10
# OTP / magic-link / recovery-token verifications per 5 minutes per IP address.
token_verifications = 10

[auth.captcha]
# CAPTCHA stays off by decision (docs/security/authentication.md, "Anti-automation on recovery"): every
# Supabase-supported provider (Turnstile, hCaptcha) needs a third-party script and frame, which the CSP
# (script-src 'self', frame-src 'none'; T279/T331) forbids. Automation against sign-in and recovery is
# limited by [auth.rate_limit] (per IP), max_frequency (per address), the lockout hook and uniform responses.
enabled = false

[auth.sessions]
# Absolute session lifetime aligned with security_settings.session_absolute_hours (12 h default).
timebox = "12h"
inactivity_timeout = "1h"

[auth.email]
enable_signup = false
# Changing the e-mail address must be confirmed from both the old and the new address.
double_confirm_changes = true
enable_confirmations = true
# Password changes from a session older than 24 h require reauthentication (nonce), in addition to
# the current-password check performed by the change-password screen.
secure_password_change = true
# At most one e-mail per address per minute (recovery, invitation, change), on top of [auth.rate_limit].
max_frequency = "60s"
otp_length = 6
# Invitation, recovery and e-mail-change links are single use and expire after 15 minutes (T2).
otp_expiry = 900

# Custom templates (T1386/T2157): links back to the app only - no passwords, no patient data, a fixed
# "we never ask for your password" statement and a disclaimer. Tested by backend/tests/test_secure_config.py.
[auth.email.template.invite]
subject = "You have been invited to ACME Clinical"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your ACME Clinical password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new ACME Clinical e-mail address"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Your ACME Clinical confirmation code"
content_path = "./supabase/templates/reauthentication.html"

# Security notification after every password change (T2 step 6). The password is never included.
[auth.email.notification.password_changed]
enabled = true
subject = "Your ACME Clinical password was changed"
content_path = "./supabase/templates/password_changed.html"

[auth.email.notification.email_changed]
enabled = true
subject = "Your ACME Clinical e-mail address was changed"
content_path = "./supabase/templates/email_changed.html"

# Transactional e-mail through the organisation's provider (SPF/DKIM/DMARC aligned, see
# docs/security/deployment.md). Credentials come from the operator's environment, never from this file.
# Port 587 = SMTP submission with STARTTLS; the provider must refuse plaintext AUTH.
[auth.email.smtp]
enabled = true
host = "env(SUPABASE_SMTP_HOST)"
port = 587
user = "env(SUPABASE_SMTP_USER)"
pass = "env(SUPABASE_SMTP_PASS)"
admin_email = "env(SUPABASE_SMTP_ADMIN_EMAIL)"
sender_name = "ACME Clinical"

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 10

# TOTP MFA (authenticator app). Required for administrators: the API rejects admin tokens below aal2.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.mfa.web_authn]
enroll_enabled = false
verify_enabled = false

# Per-account soft lockout (supabase/migrations/0006_auth.sql). Also enable it in the hosted project:
# Dashboard > Authentication > Hooks > Password Verification Attempt (requires a plan that offers it).
[auth.hook.password_verification_attempt]
enabled = true
uri = "pg-functions://postgres/public/hook_password_verification_attempt"

[auth.external.apple]
enabled = false

[auth.external.google]
enabled = false

[auth.external.github]
enabled = false
